name: Release

# Run it from Actions › Release › Run workflow with the tag vX.Y.Z (same as VERSION in src/taxmod_print_agent.py), or
# push that tag: tests run, the .deb is built and attached to the release; «taxmod-printservice update» installs it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v0.4.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Build .deb
        run: scripts/build-deb.sh "$TAG"
      - name: Check package
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --title "$TAG" --generate-notes
